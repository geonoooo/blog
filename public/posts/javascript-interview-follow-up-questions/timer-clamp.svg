<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-labelledby="clamp-title">
  <title id="clamp-title">연쇄 setTimeout(fn, 0)의 실제 대기 시간. Chromium 155에서 40회 측정한 중앙값: 1~6번째 호출은 0ms, 7~12번째 호출은 4.5~4.6ms</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 13px; fill: #e1e4e8; }
      .muted { fill: #b1bac4; }
      .small { font-size: 12.5px; }
      .bold { font-weight: 700; }
      .title { font-size: 16px; font-weight: 700; }
      .tick { font-size: 12.5px; fill: #b1bac4; font-variant-numeric: tabular-nums; }
      .grid { stroke: #3b4249; stroke-width: 1; }
      .base { stroke: #586069; stroke-width: 1; }
      .limit { stroke: #959da5; stroke-width: 1; }
      .bar { fill: #79b8ff; }
    </style>
  </defs>

  <rect width="720" height="368" rx="12" fill="#24292e" />
  <text x="24" y="34" class="title">연쇄 setTimeout(fn, 0)의 실제 대기 시간</text>
  <text x="24" y="56" class="small muted">Chromium 155, 40회 측정 중앙값. 각 콜백 안에서 다음 setTimeout(fn, 0)을 호출</text>

  <!-- 눈금선: 0, 2, 4, 6ms (36px/ms, 기준선 y=300) -->
  <line x1="72" y1="84" x2="696" y2="84" class="grid" />
  <line x1="72" y1="228" x2="696" y2="228" class="grid" />
  <line x1="72" y1="156" x2="696" y2="156" class="limit" />
  <text x="62" y="304" text-anchor="end" class="tick">0</text>
  <text x="62" y="232" text-anchor="end" class="tick">2</text>
  <text x="62" y="160" text-anchor="end" class="tick">4</text>
  <text x="62" y="88" text-anchor="end" class="tick">6ms</text>
  <text x="80" y="149" class="small muted">HTML 표준 하한 4ms</text>

  <!-- 1~6번째: 0ms (기준선 위 2px로 자리만 표시) -->
  <rect x="86" y="298" width="24" height="2" class="bar" />
  <rect x="138" y="298" width="24" height="2" class="bar" />
  <rect x="190" y="298" width="24" height="2" class="bar" />
  <rect x="242" y="298" width="24" height="2" class="bar" />
  <rect x="294" y="298" width="24" height="2" class="bar" />
  <rect x="346" y="298" width="24" height="2" class="bar" />

  <!-- 7~12번째: 4.5, 4.5, 4.5, 4.55, 4.5, 4.6ms -->
  <path d="M398,300 V142 Q398,138 402,138 H418 Q422,138 422,142 V300 Z" class="bar" />
  <path d="M450,300 V142 Q450,138 454,138 H470 Q474,138 474,142 V300 Z" class="bar" />
  <path d="M502,300 V142 Q502,138 506,138 H522 Q526,138 526,142 V300 Z" class="bar" />
  <path d="M554,300 V140.2 Q554,136.2 558,136.2 H574 Q578,136.2 578,140.2 V300 Z" class="bar" />
  <path d="M606,300 V142 Q606,138 610,138 H626 Q630,138 630,142 V300 Z" class="bar" />
  <path d="M658,300 V138.4 Q658,134.4 662,134.4 H678 Q682,134.4 682,138.4 V300 Z" class="bar" />

  <line x1="72" y1="300" x2="696" y2="300" class="base" />

  <text x="228" y="284" text-anchor="middle" class="bold">1~6번째: 0ms (최대 0.2)</text>
  <text x="540" y="122" text-anchor="middle" class="bold">7번째부터: 4.5ms (4.1~4.7)</text>

  <!-- x축 -->
  <text x="98" y="320" text-anchor="middle" class="tick">1</text>
  <text x="150" y="320" text-anchor="middle" class="tick">2</text>
  <text x="202" y="320" text-anchor="middle" class="tick">3</text>
  <text x="254" y="320" text-anchor="middle" class="tick">4</text>
  <text x="306" y="320" text-anchor="middle" class="tick">5</text>
  <text x="358" y="320" text-anchor="middle" class="tick">6</text>
  <text x="410" y="320" text-anchor="middle" class="tick">7</text>
  <text x="462" y="320" text-anchor="middle" class="tick">8</text>
  <text x="514" y="320" text-anchor="middle" class="tick">9</text>
  <text x="566" y="320" text-anchor="middle" class="tick">10</text>
  <text x="618" y="320" text-anchor="middle" class="tick">11</text>
  <text x="670" y="320" text-anchor="middle" class="tick">12</text>
  <text x="384" y="348" text-anchor="middle" class="small muted">몇 번째 setTimeout 호출인가</text>
</svg>
