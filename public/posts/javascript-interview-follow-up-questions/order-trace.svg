<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476" role="img" aria-labelledby="trace-title">
  <title id="trace-title">출력 순서 문제의 단계별 큐 상태: await 직후, 동기 코드 끝, 마이크로태스크 처리, 태스크 처리</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 13px; fill: #e1e4e8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .muted { fill: #b1bac4; }
      .small { font-size: 12px; }
      .bold { font-weight: 700; }
      .head { font-size: 13.5px; font-weight: 700; }
      .title { font-size: 17px; font-weight: 700; }
      .cell { fill: #2f363d; stroke: #444d56; }
      .frame { fill: #383f47; stroke: #586069; }
      .micro { fill: #ffab70; fill-opacity: 0.16; stroke: #ffab70; }
      .task { fill: #79b8ff; fill-opacity: 0.16; stroke: #79b8ff; }
    </style>
  </defs>

  <rect width="720" height="476" rx="12" fill="#24292e" />
  <text x="24" y="34" class="title">단계별 큐 상태</text>

  <!-- 단계 머리 -->
  <text x="132" y="72" class="head">① await 직후</text>
  <text x="132" y="92" class="small muted">first가 멈추고 빠짐</text>
  <text x="278" y="72" class="head">② 동기 코드 끝</text>
  <text x="278" y="92" class="small muted">콜 스택이 빔</text>
  <text x="424" y="72" class="head">③ 마이크로태스크</text>
  <text x="424" y="92" class="small muted">큐를 전부 비움</text>
  <text x="570" y="72" class="head">④ 태스크 하나</text>
  <text x="570" y="92" class="small muted">태스크 큐에서 꺼냄</text>

  <!-- 콜 스택 행 -->
  <text x="24" y="134" class="head">콜 스택</text>
  <text x="24" y="152" class="small muted">실행 중</text>
  <rect x="124" y="108" width="136" height="96" rx="8" class="cell" />
  <rect x="132" y="170" width="120" height="26" rx="5" class="frame" />
  <text x="192" y="188" text-anchor="middle" class="small">전역 코드</text>
  <rect x="270" y="108" width="136" height="96" rx="8" class="cell" />
  <text x="338" y="161" text-anchor="middle" class="small muted">(비었음)</text>
  <rect x="416" y="108" width="136" height="96" rx="8" class="cell" />
  <rect x="424" y="118" width="120" height="26" rx="5" class="frame" />
  <text x="484" y="136" text-anchor="middle" class="mono">first 재개</text>
  <rect x="424" y="150" width="120" height="26" rx="5" class="frame" />
  <text x="484" y="168" text-anchor="middle" class="mono">then 콜백</text>
  <text x="484" y="194" text-anchor="middle" class="small muted">위에서부터 차례로</text>
  <rect x="562" y="108" width="136" height="96" rx="8" class="cell" />
  <rect x="570" y="170" width="120" height="26" rx="5" class="frame" />
  <text x="630" y="188" text-anchor="middle" class="mono">setTimeout 콜백</text>

  <!-- 마이크로태스크 큐 행 -->
  <text x="24" y="238" class="head">마이크로</text>
  <text x="24" y="256" class="head">태스크 큐</text>
  <rect x="124" y="212" width="136" height="72" rx="8" class="cell" />
  <rect x="132" y="222" width="120" height="26" rx="5" class="micro" />
  <text x="192" y="240" text-anchor="middle" class="mono">first 재개</text>
  <rect x="270" y="212" width="136" height="72" rx="8" class="cell" />
  <rect x="278" y="222" width="120" height="26" rx="5" class="micro" />
  <text x="338" y="240" text-anchor="middle" class="mono">first 재개</text>
  <rect x="278" y="252" width="120" height="26" rx="5" class="micro" />
  <text x="338" y="270" text-anchor="middle" class="mono">then 콜백</text>
  <rect x="416" y="212" width="136" height="72" rx="8" class="cell" />
  <text x="484" y="253" text-anchor="middle" class="small muted">(비었음)</text>
  <rect x="562" y="212" width="136" height="72" rx="8" class="cell" />
  <text x="630" y="253" text-anchor="middle" class="small muted">(비었음)</text>

  <!-- 태스크 큐 행 -->
  <text x="24" y="322" class="head">태스크 큐</text>
  <rect x="124" y="292" width="136" height="50" rx="8" class="cell" />
  <rect x="132" y="304" width="120" height="26" rx="5" class="task" />
  <text x="192" y="322" text-anchor="middle" class="mono">setTimeout 콜백</text>
  <rect x="270" y="292" width="136" height="50" rx="8" class="cell" />
  <rect x="278" y="304" width="120" height="26" rx="5" class="task" />
  <text x="338" y="322" text-anchor="middle" class="mono">setTimeout 콜백</text>
  <rect x="416" y="292" width="136" height="50" rx="8" class="cell" />
  <rect x="424" y="304" width="120" height="26" rx="5" class="task" />
  <text x="484" y="322" text-anchor="middle" class="mono">setTimeout 콜백</text>
  <rect x="562" y="292" width="136" height="50" rx="8" class="cell" />
  <text x="630" y="321" text-anchor="middle" class="small muted">(비었음)</text>

  <!-- 출력 행 -->
  <text x="24" y="374" class="head">새로 찍힌</text>
  <text x="24" y="392" class="head">출력</text>
  <rect x="124" y="350" width="136" height="84" rx="8" class="cell" />
  <text x="134" y="372" class="mono">script start</text>
  <text x="134" y="392" class="mono">first start</text>
  <text x="134" y="412" class="mono">second</text>
  <rect x="270" y="350" width="136" height="84" rx="8" class="cell" />
  <text x="280" y="372" class="mono">promise executor</text>
  <text x="280" y="392" class="mono">script end</text>
  <rect x="416" y="350" width="136" height="84" rx="8" class="cell" />
  <text x="426" y="372" class="mono">first end</text>
  <text x="426" y="392" class="mono">then</text>
  <rect x="562" y="350" width="136" height="84" rx="8" class="cell" />
  <text x="572" y="372" class="mono">setTimeout</text>

  <text x="24" y="460" class="small muted">콜 스택이 비어야 큐의 콜백이 올라가고, 마이크로태스크 큐가 빈 뒤에야 태스크 큐로 넘어간다</text>
</svg>
